name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The scientific lessons (NumPy, pandas, scikit-learn, Matplotlib) can't be downloaded inside the Node test
      # environment, so their reference solutions run on a native Python through the same test runner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the scientific stack for lesson verification
        run: |
          python -m venv "$RUNNER_TEMP/sci"
          "$RUNNER_TEMP/sci/bin/pip" install numpy pandas scikit-learn matplotlib
          echo "PYTHIA_NATIVE_PYTHON=$RUNNER_TEMP/sci/bin/python" >> "$GITHUB_ENV"
      - run: npm run lint
      - name: Type-check the AI proxy Worker
        run: npm --prefix worker ci && npm --prefix worker run typecheck
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
