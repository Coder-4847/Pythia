name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the scientific stack for lesson verification
        run: |
          python -m venv "$RUNNER_TEMP/sci"
          "$RUNNER_TEMP/sci/bin/pip" install numpy pandas scikit-learn matplotlib
          echo "PYTHIA_NATIVE_PYTHON=$RUNNER_TEMP/sci/bin/python" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm test
      - name: Build
        env:
          # Project sites live at /<repo-name>/; user/org sites ("<owner>.github.io") live at "/".
          # The base path is derived from the repository name so forks deploy without edits.
          BASE_PATH: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          # Optional features: unset secrets simply leave the app in guest + local-only mode.
          VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
